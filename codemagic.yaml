workflows:
  ios_testflight:
    name: iOS First Signed Build
    integrations:
      app_store_connect: '2Marines Apple Signing'
    working_directory: frontend/flutter
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.2marines.2marinesOnline
        APP_STORE_CONNECT_KEY_ID: Q77LUSGPN7
      ios_signing:
        provisioning_profiles:
          - shieldmate_app_store
        certificates:
          - 2Marines ShieldMate Distribution
    scripts:
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles --project ios/Runner.xcodeproj --code-signing-setup-verbose-logging
      - name: Build IPA
        script: |
          flutter build ipa --release --build-number=$CM_BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist
          test -f build/ios/ipa/*.ipa || { echo "ERROR: IPA export missing"; exit 1; }
      - name: Verify IPA artifact location
        script: |
          echo "Working directory: $(pwd)"
          echo "CM_BUILD_DIR: $CM_BUILD_DIR"
          find "$CM_BUILD_DIR" -type f -name '*.ipa' -print
          find "$CM_BUILD_DIR" -type f -name '*.dSYM.zip' -print
    artifacts:
      - $CM_BUILD_DIR/frontend/flutter/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/frontend/flutter/build/ios/ipa/*.dSYM.zip
      - $CM_BUILD_DIR/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/build/ios/ipa/*.dSYM.zip
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
