workflows:
  ios_testflight:
    name: iOS First Signed Build
    working_directory: frontend/flutter
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.2marines.2marinesOnline
        APP_STORE_CONNECT_KEY_ID: Q77LUSGPN7
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.2marines.2marinesOnline
    scripts:
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release --build-number=$CM_BUILD_NUMBER
    artifacts:
      - frontend/flutter/build/ios/ipa/*.ipa
      - frontend/flutter/build/ios/ipa/*.dSYM.zip
